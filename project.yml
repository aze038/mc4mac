# XcodeGen project definition. Generate the Xcode project with:
#   brew install xcodegen && xcodegen generate
# then open FalconMail.xcodeproj.
name: FalconMail
options:
  bundleIdPrefix: com.falconmail
  developmentLanguage: en
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
packages:
  FalconCore:
    path: .
targets:
  FalconMail:
    type: application
    platform: macOS
    sources:
      - path: App/FalconMail
        excludes:
          - "Config/GoogleOAuth.example.plist"
    dependencies:
      - package: FalconCore
        product: FalconCore
    info:
      path: App/FalconMail/Info.plist
      properties:
        CFBundleName: FalconMail
        CFBundleDisplayName: FalconMail
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "14.0"
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: "Copyright © 2026 FalconMail"
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
          NSAllowsArbitraryLoadsInWebContent: true
        CFBundleDevelopmentRegion: en
        CFBundleAllowMixedLocalizations: true
        FalconUpdateRepository: aze038/mc4mac
        FalconGoogleClientID: ""
        FalconGoogleClientSecret: ""
    entitlements:
      path: App/FalconMail/FalconMail.entitlements
      properties:
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.falconmail.app
        ARCHS: arm64
        ONLY_ACTIVE_ARCH: YES
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        DEAD_CODE_STRIPPING: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
      configs:
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          SWIFT_COMPILATION_MODE: wholemodule
          GCC_OPTIMIZATION_LEVEL: s
          STRIP_INSTALLED_PRODUCT: YES
          STRIP_STYLE: all
          COPY_PHASE_STRIP: YES
          DEPLOYMENT_POSTPROCESSING: YES
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
          ENABLE_TESTABILITY: NO
          ASSETCATALOG_COMPILER_OPTIMIZATION: space
