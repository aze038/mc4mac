name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, for example 0.2.0"
        required: true
      mandatory:
        description: "Mandatory update (serious bug fix)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    name: Build, sign, package, publish
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 60
    env:
      VERSION: ${{ github.event.inputs.version || github.ref_name }}
      HAS_CERT: ${{ secrets.MACOS_CERTIFICATE_P12 != '' }}
      HAS_NOTARY: ${{ secrets.APPLE_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: xcodebuild -version

      - name: Install XcodeGen
        run: command -v xcodegen >/dev/null || brew install xcodegen

      - name: Set version
        run: |
          V="${VERSION#v}"
          echo "APP_VERSION=$V" >> "$GITHUB_ENV"
          sed -i '' "s/MARKETING_VERSION: .*/MARKETING_VERSION: $V/" project.yml
          sed -i '' "s/CFBundleShortVersionString: .*/CFBundleShortVersionString: \"$V\"/" project.yml
          sed -i '' "s/CURRENT_PROJECT_VERSION: .*/CURRENT_PROJECT_VERSION: ${{ github.run_number }}/" project.yml
          xcodegen generate

      - name: Embed Google OAuth client
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
        run: |
          if [ -n "$GOOGLE_OAUTH_CLIENT_ID" ]; then
            plutil -replace FalconGoogleClientID -string "$GOOGLE_OAUTH_CLIENT_ID" App/FalconMail/Info.plist
            plutil -replace FalconGoogleClientSecret -string "${GOOGLE_OAUTH_CLIENT_SECRET:-}" App/FalconMail/Info.plist
            PREFIX="${GOOGLE_OAUTH_CLIENT_ID%.apps.googleusercontent.com}"
            SCHEME="com.googleusercontent.apps.$PREFIX"
            plutil -replace CFBundleURLTypes -json "[{\"CFBundleURLName\":\"Google Sign-In\",\"CFBundleURLSchemes\":[\"$SCHEME\"]}]" App/FalconMail/Info.plist
            echo "Google sign-in embedded with URL scheme $SCHEME"
          else
            echo "::warning::GOOGLE_OAUTH_CLIENT_ID secret is not set; this build has no Google sign-in"
          fi

      - name: Embed diagnostics endpoint
        env:
          FALCON_DIAGNOSTICS_URL: ${{ secrets.FALCON_DIAGNOSTICS_URL }}
          FALCON_DIAGNOSTICS_KEY: ${{ secrets.FALCON_DIAGNOSTICS_KEY }}
        run: |
          if [ -n "$FALCON_DIAGNOSTICS_URL" ] && [ -n "$FALCON_DIAGNOSTICS_KEY" ]; then
            plutil -replace FalconDiagnosticsURL -string "$FALCON_DIAGNOSTICS_URL" App/FalconMail/Info.plist
            plutil -replace FalconDiagnosticsKey -string "$FALCON_DIAGNOSTICS_KEY" App/FalconMail/Info.plist
            echo "Diagnostics endpoint embedded"
          else
            echo "::warning::FALCON_DIAGNOSTICS_URL or FALCON_DIAGNOSTICS_KEY secret is not set; this build sends no diagnostics"
          fi

      - name: Import signing certificate
        if: env.HAS_CERT == 'true'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          echo "SIGN_IDENTITY=Developer ID Application" >> "$GITHUB_ENV"

      - name: Build
        run: |
          set -o pipefail
          if [ -n "${SIGN_IDENTITY:-}" ]; then
            SIGNING=(CODE_SIGN_IDENTITY="$SIGN_IDENTITY" CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" OTHER_CODE_SIGN_FLAGS="--timestamp --options=runtime")
          else
            SIGNING=(CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO)
          fi
          xcodebuild -project FalconMail.xcodeproj -scheme FalconMail -configuration Release \
            -destination 'platform=macOS,arch=arm64' -derivedDataPath build "${SIGNING[@]}" build 2>&1 | tee xcodebuild.log | grep -E "error:|\*\* BUILD" || true
          grep -q "\*\* BUILD SUCCEEDED \*\*" xcodebuild.log

      # The runner is the owner's Mac; the daily triage symbolicates crash reports from here.
      # The dSYM is kept on this Mac only and never uploaded.
      - name: Keep dSYM for crash symbolication
        run: |
          DSYM="build/Build/Products/Release/FalconMail.app.dSYM"
          DEST="$HOME/Library/Application Support/FalconMail Symbols/$APP_VERSION"
          if [ -d "$DSYM" ]; then
            mkdir -p "$DEST"
            rm -rf "$DEST/FalconMail.app.dSYM"
            cp -R "$DSYM" "$DEST/"
            dwarfdump --uuid "$DSYM" > "$DEST/uuids.txt"
            echo "dSYM kept in $DEST"
          else
            echo "::warning::No dSYM at $DSYM; crashes from this build cannot be symbolicated"
          fi

      - name: Notarize
        if: env.HAS_CERT == 'true' && env.HAS_NOTARY == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          APP="build/Build/Products/Release/FalconMail.app"
          ditto -c -k --keepParent "$APP" notarize.zip
          xcrun notarytool submit notarize.zip --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$APP"

      - name: Package
        run: |
          APP="build/Build/Products/Release/FalconMail.app"
          ZIP="FalconMail-$APP_VERSION.zip"
          DMG="FalconMail-$APP_VERSION.dmg"
          ditto -c -k --keepParent "$APP" "$ZIP"
          command -v create-dmg >/dev/null || brew install create-dmg
          rm -rf dmg-root && mkdir dmg-root && cp -R "$APP" dmg-root/
          create-dmg \
            --volname "FalconMail $APP_VERSION" \
            --background scripts/dmg-background.png \
            --window-pos 200 120 --window-size 540 380 \
            --icon-size 128 \
            --icon "FalconMail.app" 135 175 \
            --hide-extension "FalconMail.app" \
            --app-drop-link 405 175 \
            --no-internet-enable \
            "$DMG" dmg-root || test -f "$DMG"
          echo "DMG=$DMG" >> "$GITHUB_ENV"
          SHA=$(shasum -a 256 "$ZIP" | cut -d' ' -f1)
          MANDATORY="${{ github.event.inputs.mandatory || 'false' }}"
          cat > update.json <<JSON
          {
            "version": "$APP_VERSION",
            "mandatory": $MANDATORY,
            "sha256": "$SHA"
          }
          JSON
          cat update.json
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
          if [ -z "${SIGN_IDENTITY:-}" ]; then
            echo "NOTE=Download the .dmg, open it and drag FalconMail to Applications. This build is not signed with a Developer ID yet, so on first launch right-click FalconMail and choose Open." >> "$GITHUB_ENV"
          else
            echo "NOTE=Download the .dmg, open it and drag FalconMail to Applications." >> "$GITHUB_ENV"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: FalconMail ${{ env.APP_VERSION }}
          generate_release_notes: true
          body: |
            ${{ github.event.inputs.mandatory == 'true' && '[mandatory]' || '' }}
            ${{ env.NOTE }}
          files: |
            ${{ env.DMG }}
            ${{ env.ZIP }}
            update.json
