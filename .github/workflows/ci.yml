name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (macOS, Apple Silicon)
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: command -v xcodegen >/dev/null || brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Embed Google OAuth client
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
        # Adds the Google URL scheme beside the mailto one project.yml declares, never in its place.
        run: scripts/embed-google-client.sh App/FalconMail/Info.plist

      - name: FalconCore tests
        run: |
          set -o pipefail
          swift test 2>&1 | tee swift-test.log

      - name: Diagnostics backend and tool tests
        run: |
          set -o pipefail
          command -v node >/dev/null || brew install node
          node --test tools/diagnostics/apps-script/test/ 2>&1 | tee node-test.log
          python3 -m unittest discover -s tools/diagnostics/test 2>&1 | tee python-test.log
          python3 -m unittest discover -s scripts/test 2>&1 | tee -a python-test.log

      - name: Build FalconMail app
        run: |
          set -o pipefail
          xcodebuild \
            -project FalconMail.xcodeproj \
            -scheme FalconMail \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee xcodebuild.log | grep -E "error:|warning: unre|\*\* BUILD|Compiling|Linking" || true
          grep -q "\*\* BUILD SUCCEEDED \*\*" xcodebuild.log

      - name: Collect errors
        if: failure()
        run: |
          echo "## Build errors" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          { grep -E "error:" xcodebuild.log swift-test.log 2>/dev/null || true; } | sort -u | head -200 >> "$GITHUB_STEP_SUMMARY"
          { grep -E "^not ok|^FAIL:|^ERROR:" node-test.log python-test.log 2>/dev/null || true; } | head -100 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            xcodebuild.log
            swift-test.log
            node-test.log
            python-test.log
          if-no-files-found: ignore
