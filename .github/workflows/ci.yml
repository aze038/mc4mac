name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  # A push only builds: the app and the tests are compiled, nothing is run, so a mistake shows in
  # a couple of minutes. The tests run when asked for, once a piece of work is finished:
  #   gh workflow run CI -r <branch> -f tests=google   (everything but the IMAP-only suites)
  #   gh workflow run CI -r <branch> -f tests=all
  workflow_dispatch:
    inputs:
      tests:
        description: "Tests to run: none, google (skips the IMAP-only suites) or all"
        default: google
        type: choice
        options: [none, google, all]
      filter:
        description: "Only the test suites matching this (e.g. Gmail or GmailBackfillTests); empty runs them all"
        default: ""
        type: string

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Builds are kept between runs outside the checkout, which the checkout wipes, so a push compiles
# only what it changed instead of everything from scratch.
env:
  SPM_CACHE: ${{ github.workspace }}/../../ci-cache/mc4mac/swiftpm
  XCODE_CACHE: ${{ github.workspace }}/../../ci-cache/mc4mac/DerivedData

jobs:
  build:
    name: Build and test (macOS, Apple Silicon)
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: command -v xcodegen >/dev/null || brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Embed Google OAuth client
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
        # Adds the Google URL scheme beside the mailto one project.yml declares, never in its place.
        run: scripts/embed-google-client.sh App/FalconMail/Info.plist

      - name: Compile FalconCore and its tests
        if: github.event_name != 'workflow_dispatch' || inputs.tests == 'none'
        run: |
          set -o pipefail
          swift build --build-tests --scratch-path "$SPM_CACHE" 2>&1 | tee swift-test.log | grep -E "error:|warning: unre|Compiling|Build complete" || true
          grep -q "Build complete" swift-test.log

      - name: FalconCore tests
        if: github.event_name == 'workflow_dispatch' && inputs.tests != 'none'
        env:
          # IMAP stays for later; while the work is on Google accounts its own suites are left out.
          IMAP_ONLY: 'FalconCoreTests\.(CatchUpTests|FlagRescanTests|IMAPTests|FakeIMAPServerTests|ConnectionTests|OpConnectionTests|FolderListTests|TrafficTests)/'
        run: |
          set -o pipefail
          args=(--scratch-path "$SPM_CACHE" --parallel)
          [ -n "${{ inputs.filter }}" ] && args+=(--filter "${{ inputs.filter }}")
          [ "${{ inputs.tests }}" = "all" ] || args+=(--skip "$IMAP_ONLY")
          swift test "${args[@]}" 2>&1 | tee swift-test.log

      - name: Diagnostics backend and tool tests
        if: github.event_name == 'workflow_dispatch' && inputs.tests != 'none'
        run: |
          set -o pipefail
          command -v node >/dev/null || brew install node
          node --test tools/diagnostics/apps-script/test/ 2>&1 | tee node-test.log
          python3 -m unittest discover -s tools/diagnostics/test 2>&1 | tee python-test.log
          python3 -m unittest discover -s scripts/test 2>&1 | tee -a python-test.log

      - name: Build FalconMail app
        run: |
          set -o pipefail
          xcodebuild \
            -project FalconMail.xcodeproj \
            -scheme FalconMail \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$XCODE_CACHE" \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee xcodebuild.log | grep -E "error:|warning: unre|\*\* BUILD|Compiling|Linking" || true
          grep -q "\*\* BUILD SUCCEEDED \*\*" xcodebuild.log

      - name: Collect errors
        if: failure()
        run: |
          echo "## Build errors" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          { grep -E "error:" xcodebuild.log swift-test.log 2>/dev/null || true; } | sort -u | head -200 >> "$GITHUB_STEP_SUMMARY"
          { grep -E "^not ok|^FAIL:|^ERROR:" node-test.log python-test.log 2>/dev/null || true; } | head -100 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            xcodebuild.log
            swift-test.log
            node-test.log
            python-test.log
          if-no-files-found: ignore
